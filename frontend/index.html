<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>커뮤니티 게시판</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; }
        input, textarea { width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
        button { padding: 10px; background: #007bff; color: white; border: none; width: 100%; cursor: pointer; }
        .post { border-bottom: 1px solid #ddd; padding: 10px 0; }
    </style>
</head>
<body>
    <h2>📝 새 글 작성</h2>
    <form id="postForm">
        <input type="text" id="title" placeholder="제목" required>
        <input type="text" id="author" placeholder="작성자" required>
        <textarea id="content" placeholder="내용" required></textarea>
        <button type="submit">등록하기</button>
    </form>

    <h2>📋 게시글 목록</h2>
    <div id="posts"></div>

    <script>
        const BACKEND_URL = 'http://localhost:5000/api/posts';

        function loadPosts() {
            axios.get(BACKEND_URL).then(res => {
                const html = res.data.map(p => `
                    <div class="post">
                        <h3>${p.title} (${p.author}) 
                            <button onclick="deletePost(${p.id})" style="width:auto; display:inline; padding:3px 8px; background:#dc3545; margin-left:10px;">삭제</button>
                        </h3>
                        <p>${p.content}</p>
                    </div>
                `).join('');
                document.getElementById('posts').innerHTML = html || '<p>등록된 글이 없습니다.</p>';
            });
        }

        function deletePost(id) {
            if (confirm('정말 이 게시글을 삭제하시겠습니까?')) {
                axios.delete(`${BACKEND_URL}/${id}`).then(() => {
                    alert('글이 삭제되었습니다!');
                    loadPosts();
                });
            }
        }

        document.getElementById('postForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const title = document.getElementById('title').value;
            const author = document.getElementById('author').value;
            const content = document.getElementById('content').value;

            axios.post(BACKEND_URL, { title, author, content }).then(() => {
                alert('글이 작성되었습니다.');
                document.getElementById('postForm').reset();
                loadPosts();
            });
        });

        loadPosts();
    </script>
</body>
</html>
