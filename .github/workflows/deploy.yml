name: CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Trigger Render Frontend
        run: |
          curl -X POST "${{ secrets.RENDER_FRONTEND_WEBHOOK_URL }}"

      - name: Trigger Render Backend
        run: |
          curl -X POST "${{ secrets.RENDER_BACKEND_WEBHOOK_URL }}"